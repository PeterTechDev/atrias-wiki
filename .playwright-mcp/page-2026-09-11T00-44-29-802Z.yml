                - generic [ref=e69]:
                  - text: Texto da seção
                  - textbox "Texto da seção" [ref=e70]: Isso se deve a história e cultura local, que no passado teve que lidar com grande opressão imposta por um governante tirano o qual possuía as terras ao redor. Não fosse pelas ações de Reynard de Sollam um corajoso guerreiro e seguidor de Uther o deus da Luz, bem como um grupo improvavel de aliados de todos os cantos de Atrias, a vila teria sucumbido perante o medo e a fome. Reynard tombou em batalha, mas por sua tenacidade e bravura recebeu a alcunha de O Leão Vermelho, e a vila foi batizada de Abrigo de Solaria em homenagem a sua devoção e ao seu desejo de um lugar em que todos fossem acolhidos.
