                  - textbox "Título da seção" [ref=e78]: Governo
                - generic [ref=e79]:
                  - text: Texto da seção
                  - textbox "Texto da seção" [ref=e80]: Solaria é governada pelo Barão Aric Valtor, um homem de meia-idade que herdou o título de seu pai. Ele é um líder justo e respeitado pela maioria dos habitantes da vila. O Barão é assessorado por um conselho de anciãos que representam as várias guildas da vila, incluindo os fazendeiros, mineradores e artesãos. É possivel marcar audiencias com o Barão para tratar de demandas urgentes, entretanto qualquer assunto que exija mais atenção, só será discutido diante do conselho que se reune a cada quinzena.
              - group "Seção 3" [ref=e81]:
                - generic [ref=e83]:
                  - button "Mover seção 3 para cima" [ref=e84]
                  - button "Mover seção 3 para baixo" [ref=e85]
                  - button "Remover seção 3" [ref=e86]
                - generic [ref=e87]:
                  - text: Título da seção
                  - textbox "Título da seção" [ref=e88]: Comércio
                - generic [ref=e89]:
                  - text: Texto da seção
                  - textbox "Texto da seção" [ref=e90]: A vila de Solaria é conhecida por seus produtos agrícolas, principalmente frutas e vegetais frescos que são vendidos na feira semanal. A vila também possui várias lojas e oficinas que vendem produtos artesanais, ferramentas, tecidos e joias. A mineração é uma outra importante atividade econômica da vila, sendo extraído principalmente ferro e prata das montanhas ao leste. A compania Roccia chefiada por Gwendolyn tambem cuida do processo de exportação de tais minerais, sendo os condados de Noan seus principais clientes.
              - group "Seção 4" [ref=e91]:
