              - generic [ref=e34]: Apresentação do lugar
              - button "Apresentação do lugar Solaria é uma pequena vila situada nas Colinas do Serpeio, entre os picos do Alvorecer a Leste e a Passagem Crepitante que leva aos bosques da Mortalha ao oeste. A vila é reconhecida por um castelo de pedra cinzenta que domina a paisagem, sendo visível de longe. A população de Solaria é composta por cerca de 600 pessoas, onde é possível encontrar membros de cada um dos povos civilizados e não é incomum se deparar com indivíduos de ancestralidades exóticas, que em outros locais seriam hostilizados." [ref=e35]:
