                  - button "Mover seção 4 para cima" [ref=e94]
                  - button "Mover seção 4 para baixo" [disabled] [ref=e95]
                  - button "Remover seção 4" [ref=e96]
                - generic [ref=e97]:
                  - text: Título da seção
                  - textbox "Título da seção" [ref=e98]: Defesas
                - generic [ref=e99]:
                  - text: Texto da seção
                  - textbox "Texto da seção" [ref=e100]: A milícia de Solaria é uma força pouco treinada e equipada, composta principalmente por voluntários da vila. Ela é responsável por manter a ordem e a segurança nas áreas rurais e nas fronteiras da vila, protegendo-a de invasores e ladrões. Composta por cerca de 15 membros e 50 voluntários, a maioria dos quais são fazendeiros e artesãos que lutam apenas em caso de necessidade. Eles usam armas simples, como lanças, arcos e espadas, e não possuem uniformes ou equipamentos padronizados. No entanto, eles são dedicados e corajosos, e estão prontos para defender sua vila a qualquer momento Os voluntários participam de treinamentos semanais, aprendem o manuseio de armas simples e estratégias de defesa. Todos os voluntários recebem um soldo ao final do mês para complementarem sua renda. Apesar de não ser uma força militar profissional, a milícia de Solaria é uma importante parte da defesa da vila. Ela é bem integrada com as outras forças de segurança da vila, como os guardas do Barão e os caçadores locais, trabalhando em conjunto para manter a paz e a segurança
