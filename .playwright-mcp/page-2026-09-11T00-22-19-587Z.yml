                - link "Izur" [ref=e334] [cursor=pointer]:
                  - /url: /characters/izur
              - paragraph [ref=e335]: Aliado das Fúrias e homem de confiança do Martelo-de-Vento. Luta na linha de frente em Torngard e chega a se sacrificar para deter inimigos durante a batalha de Coldwind.
          - listitem [ref=e339]:
            - generic [ref=e340]:
              - heading [level=2] [ref=e341]:
                - link "Khay'zam" [ref=e342] [cursor=pointer]:
                  - /url: /characters/khay-zam
              - paragraph [ref=e343]: Khay'zam é um mago humano lendário associado ao período imediatamente posterior à Ruptura. Em meio ao avanço infernal e às divindades caídas e enfraquecidas, ele reuniu os poucos avatares divinos restantes e liderou forças celestiais contra as hordas do Lorde Supremo Drawghar Mototh. A vitória — obtida a alto custo — culminou no selamento de Mototh e na expulsão de sua horda. Após o conflito, as divindades sobreviventes teriam imbuído Khay'zam com parte de seu poder e conhecimento para que protegesse e vigiasse o mundo. Com esse legado, ele fundou as Alta'Arcanas, torres destinadas a concentrar o saber arcano e impedir que a magia voltasse a desencadear um cataclismo como o da Ruptura.
          - listitem [ref=e347]:
            - generic [ref=e348]:
              - heading [level=2] [ref=e349]:
                - link "Khayzam" [ref=e350] [cursor=pointer]:
                  - /url: /characters/khayzam
              - paragraph [ref=e351]: Humano (presumido)
              - paragraph [ref=e352]: "Arquimago Khayzam. Um nome que ecoa pelos corredores das academias arcanas e pelas tavernas mais remotas de Átrias — embora poucos saibam separar o homem da lenda. Dizem que Khayzam foi o maior mago que já pisou no continente de Skeld. Alguns o chamam de gênio. Outros, de louco. A verdade, como sempre, é mais complicada. Sua obra mais conhecida — e mais temida — é o Livro das Estórias Não Contadas. Um artefato que não apenas registra o passado, mas parece conhecer o futuro. Como Khayzam o criou, ninguém sabe ao certo. Por que ele o criou é uma pergunta ainda mais perigosa. O que se sabe: Khayzam desapareceu há séculos. Seu corpo nunca foi encontrado. Seus estudos permanecem espalhados por bibliotecas e ruínas, cada fragmento mais enigmático que o anterior. E o Livro? O Livro encontrou seu próprio guardião — um ladrão tolo o bastante para tentar roubá-lo. Registrado por: Thaveus, O Escriba"
          - listitem [ref=e356]:
