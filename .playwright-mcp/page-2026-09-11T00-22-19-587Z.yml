            - generic [ref=e33]:
              - heading [level=2] [ref=e34]:
                - link "Alan Kendra" [ref=e35] [cursor=pointer]:
                  - /url: /characters/alan-kendra
              - paragraph [ref=e36]: Aliado dos Ursos-Negros (Coldwind). Reúne-se com Eibjolf e Izur como homem de confiança do Martelo-de-Vento; invoca forças da natureza em combate.
          - listitem [ref=e40]:
            - generic [ref=e41]:
              - heading [level=2] [ref=e42]:
                - link "Amergin Ghalbath" [ref=e43] [cursor=pointer]:
                  - /url: /characters/amergin-ghalbath
              - paragraph [ref=e44]: "Amergin Ghalbath é a figura central do mito de origem associado a Ghalbaht. Sua vida anterior é descrita como comum e incerta — pescador, pastor, padeiro — mas seu passado teria sido apagado (ou “transmutado”). No período pré-Ruptura, ao socorrer um homem mortalmente ferido, Amergin afirma sentir o lamento do mundo: a terra, o vento, a água e o sol pareciam sofrer com aquela morte. O moribundo revela-se Silvanus, então deus da natureza e dos elementos. Para proteger Amergin do que viria, Silvanus arrebata sua alma e a envia aos Planos Interiores, para que ouvisse a voz do mundo. Imbuído da essência vital do deus, Amergin vaga por décadas entre os quatro Planos Elementais: sua alma atravessa o Ar, é forjada no Fogo, moldada na Terra e renascida na Água. Entre djinns, elementais e para-elementais, ele aprende e compreende a necessidade de cicatrizar as feridas do mundo para que o ciclo continue. Seu retorno a Átrias é narrado como um prodígio: cinzas ao vento se aglomeram e tomam a forma de um homem, enquanto madeira queimada revive e brotos surgem — sinal de que Ghalbath volta não mais como um homem comum."
          - listitem [ref=e48]:
            - generic [ref=e49]:
              - heading [level=2] [ref=e50]:
                - link "Andrastos" [ref=e51] [cursor=pointer]:
                  - /url: /characters/andrastos
              - paragraph [ref=e52]: "Andrastos foi o governante de Vallen durante a escalada das invasões skeldianas ao norte da Terra dos Vales. Ao encontrar um porto e uma cidade rudimentar nos Rochedos de Baldren, escolheu a diplomacia e propôs um acordo com um clã invasor: concessão de terras e títulos em troca da proteção do norte de Humma. O trato desencadeou a reação de Skeld e a formação da primeira Horda. Para proteger o continente Oeste, Andrastos liderou a marcha do Pacto de Ociddens ao norte, acompanhado da Guarda Argêntea e de Cavaleiros de Nerânia. O Pacto venceu após dias de combate, mas Andrastos morreu na batalha. Sua memória permaneceu como símbolo de união e resistência."
          - listitem [ref=e56]:
            - generic [ref=e57]:
              - heading [level=2] [ref=e58]:
                - link "Andrastos O Unificador" [ref=e59] [cursor=pointer]:
                  - /url: /characters/andrastos-o-unificador
              - paragraph [ref=e60]: “Andrastos, o Unificador” é o título dado ao governante de Vallen que enfrentou a crise da primeira Horda skelden. Ele liderou, com a Guarda Argêntea e apoio dos Cavaleiros de Nerânia, o esforço do Pacto de Ociddens que salvou o continente Oeste. Andrastos morreu na campanha; anualmente, no dia de sua morte, celebra-se um festival em sua homenagem em Norbria e em Vallen.
