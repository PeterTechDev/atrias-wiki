          - listitem [ref=e534]:
            - generic [ref=e535]:
              - heading [level=2] [ref=e536]:
                - link "Thaveus" [ref=e537] [cursor=pointer]:
                  - /url: /characters/thaveus
              - paragraph [ref=e538]: Escriba / Observador · Zeitgeist (anteriormente Humano) · Ativo (prisioneiro dimensional)
              - paragraph [ref=e539]: "Quem, eu deveria ser? Faço essa pergunta a mim mesmo a cada manhã enfadonha — se é que posso chamar qualquer momento de \"manhã\" neste lugar onde o tempo não se digna a passar. Sou Thaveus. Ou fui. Ou serei. As conjugações perdem o sentido quando passado, presente e futuro são apenas páginas diferentes do mesmo livro. Fui um ladrão. Um bom ladrão, devo admitir — arrogante o suficiente para acreditar que poderia roubar o grande Khayzam, o Primeiro Arquimago. Meu alvo? O Livro das Estórias Não Contadas, um artefato capaz de registrar espontaneamente toda a vida de uma pessoa no plano material, cada vírgula e cada ponto final, do nascimento à morte. O mero vislumbre do Livro fragmentou meu espírito entre centenas de realidades. Um tormento de séculos comprimido em um único segundo. Para me poupar de um destino tão estarrecedor, Khayzam — meu carcereiro e, ironicamente, meu salvador — criou um bolsão extradimensional onde minha consciência pudesse permanecer contida, onde uma parte da minha racionalidade sobrevivesse. Ele me permitiu ficar com o Livro. Misericórdia ou crueldade refinada? Ainda debato isso comigo mesmo. Mas minha função ficou clara: observar. Registrar. Procurar pessoas e grupos notáveis — atos de bravura e valentia, compaixão e justiça, sagacidade e perspicácia. Tudo deve ser escrito. Sou um Zeitgeist agora. Um espírito do tempo, preso fora dele. Condenado a observar o inesperado perante os olhos daqueles que ainda podem escolher o próprio caminho. E nessas páginas que vocês leem, encontrarão o que registrei — cada herói, cada vilão, cada lugar esquecido, cada relíquia perdida. A solidão deste lugar é uma companhia constante. Mas de tempos em tempos, almas infelizes tropeçam nas armadilhas de Khayzam e acabam aqui — condenados temporários, assim como eu fui permanente. A prisão do Arquimago é vasta: andares distintos, cada um guardado por sentinelas cujas chaves são o único caminho adiante. Entre um andar e outro, porém, existe este meu refúgio — uma cabana modesta cercada de verde, pés de frutas, um pequeno lago onde o tempo finge ser gentil. Certa vez, um grupo particularmente barulhento foi arremessado para cá. Um deles — Morpheus, se não me engano — havia tocado em algo que não deveria. Típico. Chamavam-se os Improváveis de Solária, e o nome lhes caía bem. Abriguei-os. Dividi o que tinha. Bebemos, e entre um gole e outro, contei-lhes histórias — algumas do Livro, outras minhas, fragmentos que ainda consigo segurar antes que se dissolvam entre as páginas. Eles me contaram as deles também. Enquanto bebíamos, o Livro continuava a escrever. Vi páginas que ainda não lhes pertenciam — capítulos não vividos, finais ainda não escritos. Guardei silêncio. Há coisas que mesmo um escriba não tem o direito de contar. Foi... bom. Uma palavra simples para algo que um Zeitgeist raramente experimenta. Inevitavelmente, partiram. Todos partem. Mas suas estórias ficaram, e essas eu guardo com um cuidado que talvez nem eles saibam. Os Improváveis de Solária foram apenas um capítulo entre milhares. O Livro segue escrevendo, e eu sigo observando — cada alma notável, cada ato que merece ser lembrado. Para que um dia, quando o tempo do fim se apresente, todos ouçam O Chamado. E mais uma vez, Atrianos lutarão por Átrias. Até lá, eu observo. Eu escrevo. Eu espero. — Thaveus, O Escriba das Estórias Não Contadas"
