              - paragraph [ref=e254]: Ghalbath é lembrado como um druida lendário ligado à fundação e aos ideais da Ordem de Ghalbaht. A tradição reforça seu repúdio ao uso de armas ofensivas e a centralidade do escudo como símbolo de defesa do círculo e da ordem natural. Também é associado ao mito de Amergin Ghalbath, no qual uma alma é moldada pelos quatro Planos Elementais para ouvir a voz do mundo e retornar como agente de equilíbrio.
