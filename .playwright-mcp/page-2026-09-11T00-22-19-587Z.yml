              - heading [level=2] [ref=e398]:
                - link "Luminares" [ref=e399] [cursor=pointer]:
                  - /url: /characters/luminares
              - paragraph [ref=e400]: "Luminares é o nome dado ao clero da Chama Branca. Seus membros atuam como guardiões da lei, da ordem e da luz, conduzindo ritos, julgamentos e atos de restauração quando a corrupção se espalha. A tradição descreve uma progressão de graus: Vigilante, Luminar da Sentença e Luminar Elevado. Em muitas comunidades, os Luminares não se distinguem por uma vestimenta única — preferem sinais discretos ligados à vigilância e à justiça (como balanças, velas e a espada longa cruzada), refletindo a ideia de que a justiça deve existir em qualquer cultura."
